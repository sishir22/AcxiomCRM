<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{{ page_title }} - AcxiomCRM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a
            href="{% url 'dashboard' %}"
            class="navbar-brand">

            AcxiomCRM

        </a>

    </div>

</nav>


<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between mb-4">

                <h2>{{ page_title }}</h2>

                <a
                    href="{% url 'opportunity_list' %}"
                    class="btn btn-outline-secondary">

                    Back

                </a>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Opportunity Name *
                        </label>

                        <input
                            type="text"
                            name="opportunity_name"
                            class="form-control"
                            required
                            value="{{ opportunity.opportunity_name|default:'' }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer *
                        </label>

                        <select
                            name="customer"
                            class="form-select"
                            required>

                            <option value="">
                                Select customer
                            </option>

                            {% for customer in customers %}

                                <option
                                    value="{{ customer.id }}"
                                    {% if opportunity.customer_id == customer.id %}
                                    selected
                                    {% endif %}>

                                    {{ customer.customer_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Related Lead
                        </label>

                        <select
                            name="lead"
                            class="form-select">

                            <option value="">
                                None
                            </option>

                            {% for lead in leads %}

                                <option
                                    value="{{ lead.id }}"
                                    {% if opportunity.lead_id == lead.id %}
                                    selected
                                    {% endif %}>

                                    {{ lead.lead_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Amount *
                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            min="0.01"
                            step="0.01"
                            required
                            value="{{ opportunity.amount|default:'' }}">

                        <small class="text-muted">
                            Must be greater than 0.
                        </small>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Stage
                        </label>

                        <select
                            name="stage"
                            class="form-select">

                            <option
                                value="QUALIFICATION"
                                {% if opportunity.stage == 'QUALIFICATION' %}
                                selected
                                {% endif %}>
                                Qualification
                            </option>

                            <option
                                value="PROPOSAL"
                                {% if opportunity.stage == 'PROPOSAL' %}
                                selected
                                {% endif %}>
                                Proposal
                            </option>

                            <option
                                value="NEGOTIATION"
                                {% if opportunity.stage == 'NEGOTIATION' %}
                                selected
                                {% endif %}>
                                Negotiation
                            </option>

                            <option
                                value="WON"
                                {% if opportunity.stage == 'WON' %}
                                selected
                                {% endif %}>
                                Won
                            </option>

                            <option
                                value="LOST"
                                {% if opportunity.stage == 'LOST' %}
                                selected
                                {% endif %}>
                                Lost
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Probability *
                        </label>

                        <input
                            type="number"
                            name="probability"
                            class="form-control"
                            min="0"
                            max="100"
                            required
                            value="{{ opportunity.probability|default:'50' }}">

                        <small class="text-muted">
                            0–100%.
                        </small>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option
                                value="OPEN"
                                {% if opportunity.status == 'OPEN' %}
                                selected
                                {% endif %}>
                                Open
                            </option>

                            <option
                                value="WON"
                                {% if opportunity.status == 'WON' %}
                                selected
                                {% endif %}>
                                Won
                            </option>

                            <option
                                value="LOST"
                                {% if opportunity.status == 'LOST' %}
                                selected
                                {% endif %}>
                                Lost
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expected Close Date *
                        </label>

                        <input
                            type="date"
                            name="expected_close_date"
                            class="form-control"
                            required
                            min="{{ today }}"
                            value="{{ opportunity.expected_close_date|default:'' }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Assigned To
                        </label>

                        <select
                            name="assigned_to"
                            class="form-select">

                            <option value="">
                                Select user
                            </option>

                            {% for user in users %}

                                <option
                                    value="{{ user.id }}"
                                    {% if opportunity.assigned_to_id == user.id %}
                                    selected
                                    {% endif %}>

                                    {{ user.username }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-12 mb-4">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            class="form-control"
                            rows="4">{{ opportunity.notes|default:'' }}</textarea>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Opportunity

                </button>

                <a
                    href="{% url 'opportunity_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
