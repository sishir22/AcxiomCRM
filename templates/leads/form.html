<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{{ page_title }} - AcxiomCRM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a
            href="{% url 'dashboard' %}"
            class="navbar-brand">

            AcxiomCRM

        </a>

    </div>

</nav>


<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between mb-4">

                <h2>{{ page_title }}</h2>

                <a
                    href="{% url 'lead_list' %}"
                    class="btn btn-outline-secondary">

                    Back

                </a>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Lead Name *
                        </label>

                        <input
                            type="text"
                            name="lead_name"
                            class="form-control"
                            maxlength="100"
                            required
                            value="{{ lead.lead_name|default:'' }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email *
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                            value="{{ lead.email|default:'' }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone *
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            pattern="[0-9]{10,15}"
                            required
                            value="{{ lead.phone|default:'' }}">

                        <small class="text-muted">
                            Enter 10–15 digits.
                        </small>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Company
                        </label>

                        <input
                            type="text"
                            name="company_name"
                            class="form-control"
                            value="{{ lead.company_name|default:'' }}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Lead Source
                        </label>

                        <select
                            name="source"
                            class="form-select">

                            <option value="">
                                Select source
                            </option>

                            <option
                                value="Website"
                                {% if lead.source == 'Website' %}
                                selected
                                {% endif %}>
                                Website
                            </option>

                            <option
                                value="Referral"
                                {% if lead.source == 'Referral' %}
                                selected
                                {% endif %}>
                                Referral
                            </option>

                            <option
                                value="Social Media"
                                {% if lead.source == 'Social Media' %}
                                selected
                                {% endif %}>
                                Social Media
                            </option>

                            <option
                                value="Advertisement"
                                {% if lead.source == 'Advertisement' %}
                                selected
                                {% endif %}>
                                Advertisement
                            </option>

                            <option
                                value="Other"
                                {% if lead.source == 'Other' %}
                                selected
                                {% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option
                                value="NEW"
                                {% if lead.status == 'NEW' %}
                                selected
                                {% endif %}>
                                New
                            </option>

                            <option
                                value="CONTACTED"
                                {% if lead.status == 'CONTACTED' %}
                                selected
                                {% endif %}>
                                Contacted
                            </option>

                            <option
                                value="QUALIFIED"
                                {% if lead.status == 'QUALIFIED' %}
                                selected
                                {% endif %}>
                                Qualified
                            </option>

                            <option
                                value="UNQUALIFIED"
                                {% if lead.status == 'UNQUALIFIED' %}
                                selected
                                {% endif %}>
                                Unqualified
                            </option>

                            <option
                                value="CONVERTED"
                                {% if lead.status == 'CONVERTED' %}
                                selected
                                {% endif %}>
                                Converted
                            </option>

                            <option
                                value="LOST"
                                {% if lead.status == 'LOST' %}
                                selected
                                {% endif %}>
                                Lost
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Priority
                        </label>

                        <select
                            name="priority"
                            class="form-select">

                            <option
                                value="LOW"
                                {% if lead.priority == 'LOW' %}
                                selected
                                {% endif %}>
                                Low
                            </option>

                            <option
                                value="MEDIUM"
                                {% if lead.priority == 'MEDIUM' %}
                                selected
                                {% endif %}>
                                Medium
                            </option>

                            <option
                                value="HIGH"
                                {% if lead.priority == 'HIGH' %}
                                selected
                                {% endif %}>
                                High
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Expected Value
                        </label>

                        <input
                            type="number"
                            name="expected_value"
                            class="form-control"
                            min="0"
                            step="0.01"
                            value="{{ lead.expected_value|default:'0' }}">

                    </div>


                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Assigned Sales Executive
                        </label>

                        <select
                            name="assigned_to"
                            class="form-select">

                            <option value="">
                                Select user
                            </option>

                            {% for user in users %}

                                <option
                                    value="{{ user.id }}"
                                    {% if lead.assigned_to_id == user.id %}
                                    selected
                                    {% endif %}>

                                    {{ user.username }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Lead

                </button>

                <a
                    href="{% url 'lead_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
