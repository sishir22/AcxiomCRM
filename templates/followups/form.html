<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{{ page_title }} - AcxiomCRM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a
            href="{% url 'dashboard' %}"
            class="navbar-brand">

            AcxiomCRM

        </a>

    </div>

</nav>


<div class="container py-4">


    <div class="card shadow-sm">

        <div class="card-body p-4">


            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>
                    {{ page_title }}
                </h2>

                <a
                    href="{% url 'followup_list' %}"
                    class="btn btn-outline-secondary">

                    Back

                </a>

            </div>


            <!-- Validation messages -->

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="row">


                    <!-- Customer -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer
                        </label>

                        <select
                            name="customer"
                            class="form-select">

                            <option value="">
                                Select customer
                            </option>

                            {% for customer in customers %}

                                <option
                                    value="{{ customer.id }}">

                                    {{ customer.customer_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Lead -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Lead
                        </label>

                        <select
                            name="lead"
                            class="form-select">

                            <option value="">
                                Select lead
                            </option>

                            {% for lead in leads %}

                                <option
                                    value="{{ lead.id }}">

                                    {{ lead.lead_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-12">

                        <div class="alert alert-light border">

                            Select either a <strong>Customer</strong>
                            or a <strong>Lead</strong> for this follow-up.

                        </div>

                    </div>


                    <!-- Date -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Follow-Up Date *
                        </label>

                        <input
                            type="date"
                            name="follow_up_date"
                            class="form-control"
                            required>

                    </div>


                    <!-- Type -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Follow-Up Type *
                        </label>

                        <select
                            name="follow_up_type"
                            class="form-select">

                            <option value="CALL">
                                Call
                            </option>

                            <option value="MEETING">
                                Meeting
                            </option>

                            <option value="EMAIL">
                                Email
                            </option>

                            <option value="TASK">
                                Task
                            </option>

                        </select>

                    </div>


                    <!-- Subject -->

                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Subject *
                        </label>

                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            placeholder="e.g. Follow up on CRM proposal"
                            required>

                    </div>


                    <!-- Status -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="PLANNED">
                                Planned
                            </option>

                            <option value="COMPLETED">
                                Completed
                            </option>

                            <option value="MISSED">
                                Missed
                            </option>

                            <option value="CANCELLED">
                                Cancelled
                            </option>

                        </select>

                    </div>


                    <!-- Assigned To -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Assigned To
                        </label>

                        <select
                            name="assigned_to"
                            class="form-select">

                            <option value="">
                                Select user
                            </option>

                            {% for user in users %}

                                <option
                                    value="{{ user.id }}">

                                    {{ user.username }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Remarks -->

                    <div class="col-12 mb-4">

                        <label class="form-label">
                            Remarks / Notes
                        </label>

                        <textarea
                            name="remarks"
                            class="form-control"
                            rows="4"
                            placeholder="Add notes about this follow-up"></textarea>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Follow-Up

                </button>


                <a
                    href="{% url 'followup_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>


            </form>


        </div>

    </div>

</div>


</body>

</html>
