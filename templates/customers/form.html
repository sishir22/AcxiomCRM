<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{{ page_title }} - AcxiomCRM</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a
            href="{% url 'dashboard' %}"
            class="navbar-brand">

            AcxiomCRM

        </a>

    </div>

</nav>


<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between mb-4">

                <h2>{{ page_title }}</h2>

                <a
                    href="{% url 'customer_list' %}"
                    class="btn btn-outline-secondary">

                    Back

                </a>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer Name *
                        </label>

                        <input
                            type="text"
                            name="customer_name"
                            class="form-control"
                            maxlength="100"
                            required
                            value="{{ customer.customer_name|default:'' }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email *
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                            value="{{ customer.email|default:'' }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone *
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            pattern="[0-9]{10,15}"
                            required
                            value="{{ customer.phone|default:'' }}">

                        <small class="text-muted">
                            Enter 10–15 digits.
                        </small>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Company
                        </label>

                        <input
                            type="text"
                            name="company_name"
                            class="form-control"
                            value="{{ customer.company_name|default:'' }}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input
                            type="text"
                            name="city"
                            class="form-control"
                            value="{{ customer.city|default:'' }}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            State
                        </label>

                        <input
                            type="text"
                            name="state"
                            class="form-control"
                            value="{{ customer.state|default:'' }}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option
                                value="ACTIVE"
                                {% if customer.status == 'ACTIVE' %}
                                selected
                                {% endif %}>
                                Active
                            </option>

                            <option
                                value="INACTIVE"
                                {% if customer.status == 'INACTIVE' %}
                                selected
                                {% endif %}>
                                Inactive
                            </option>

                            <option
                                value="LEAD"
                                {% if customer.status == 'LEAD' %}
                                selected
                                {% endif %}>
                                Lead
                            </option>

                        </select>

                    </div>


                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3">{{ customer.address|default:'' }}</textarea>

                    </div>


                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Assigned Sales Executive
                        </label>

                        <select
                            name="assigned_to"
                            class="form-select">

                            <option value="">
                                Select user
                            </option>

                            {% for user in users %}

                                <option
                                    value="{{ user.id }}"
                                    {% if customer.assigned_to_id == user.id %}
                                    selected
                                    {% endif %}>

                                    {{ user.username }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Customer

                </button>

                <a
                    href="{% url 'customer_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
